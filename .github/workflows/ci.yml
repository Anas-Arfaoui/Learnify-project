name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install Laravel dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: backend

      - name: Run Laravel tests
        run: composer test
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Angular for production
        run: npm run build -- --configuration production
        working-directory: frontend

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          SHORT_SHA="$(git rev-parse --short "$GITHUB_SHA")"
          BACKEND_IMAGE="learnify-backend:$SHORT_SHA"
          FRONTEND_IMAGE="learnify-frontend:$SHORT_SHA"

          docker build -f backend/Dockerfile -t "$BACKEND_IMAGE" backend
          docker build -f frontend/Dockerfile -t "$FRONTEND_IMAGE" frontend

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$BACKEND_IMAGE" learnify-backend:latest
            docker tag "$FRONTEND_IMAGE" learnify-frontend:latest
          fi
