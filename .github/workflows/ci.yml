name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install Laravel dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: backend

      - name: Generate temporary Laravel test key
        run: |
          KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          echo "APP_KEY=$KEY" >> "$GITHUB_ENV"
        working-directory: backend

      - name: Run Laravel tests
        run: composer test
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Angular for production
        run: npm run build -- --configuration production
        working-directory: frontend

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          SHORT_SHA="$(git rev-parse --short "$GITHUB_SHA")"
          BACKEND_IMAGE="learnify-backend:$SHORT_SHA"
          FRONTEND_IMAGE="learnify-frontend:$SHORT_SHA"

          docker build -f backend/Dockerfile -t "$BACKEND_IMAGE" backend
          docker build -f frontend/Dockerfile -t "$FRONTEND_IMAGE" frontend

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$BACKEND_IMAGE" learnify-backend:latest
            docker tag "$FRONTEND_IMAGE" learnify-frontend:latest
          fi

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get lowercase image owner
        id: owner
        run: |
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "value=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Create backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/learnify-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Create frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/learnify-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
