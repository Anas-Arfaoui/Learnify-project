<div class="header">
  <h2>Users List</h2>
  <div class="button-group">
    <button class="create-btn" routerLink="/CreateUser">
      <span class="icon">+</span> Create User
    </button>
    <button class="create-btn admin-btn" routerLink="/CreateAdmin">
      <span class="icon">+</span> Create Admin
    </button>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Quiz Count</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.quizzes_count }}</td>
      <td>
        <button class="edit-btn" (click)="goToEdit(user.id)">Edit</button>
        <button class="delete-btn" (click)="deleteUser(user.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
