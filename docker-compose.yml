services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-learnify}
      DB_USERNAME: ${DB_USERNAME:-learnify}
      DB_PASSWORD: ${DB_PASSWORD:-learnify_password}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-learnify}
      MYSQL_USER: ${DB_USERNAME:-learnify}
      MYSQL_PASSWORD: ${DB_PASSWORD:-learnify_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-learnify_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
